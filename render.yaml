# Render Blueprint Specification for MissionMind
# Deploy via Render Dashboard -> New -> Blueprint -> Connect Repository
version: "1"

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. FastAPI Analysis Service (Python)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: missionmind-analysis
    runtime: python
    plan: free
    region: oregon
    rootDir: analysis-service
    buildCommand: pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-4o-mini

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Node/Express Backend API
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: missionmind-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANALYSIS_SERVICE_URL
        fromService:
          type: web
          name: missionmind-analysis
          property: host

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. React / Vite Frontend (Free Static Site with Global CDN)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: missionmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
